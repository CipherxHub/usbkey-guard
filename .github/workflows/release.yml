name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install -e .
      - name: Test
        run: python -m pytest tests -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Build clean source zip
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'usbkey-release-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force src, tests, .github -Destination $stage
          Copy-Item -Force README.md, INSTALL.md, QUICKSTART.md, LIMITATIONS.md, RELEASE.md, LICENSE, pyproject.toml, requirements.txt, .gitignore, build_dist.ps1 -Destination $stage
          Get-ChildItem -Recurse -Force -Directory -Path $stage -Filter '__pycache__' | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse -Force -Directory -Path $stage -Filter '*.egg-info' | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse -Force -File -Path $stage -Filter '*.pyc' | Remove-Item -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath dist/usbkey-guard-source.zip
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/usbkey-guard-source.zip
          generate_release_notes: false
          body: |
            usbkey-guard ${{ github.ref_name }}

            A headless Windows tool that keeps files locked unless a specific USB
            stick is inserted. Files are encrypted with AES-GCM, so an administrator
            cannot read them without the USB key and the passphrase.

            Included: interactive TUI, scriptable CLI, all-users installer,
            SYSTEM background enforcer, recovery tools and documentation.

            Install in 1.0.9: `pip install -U usbkey-guard`, then
            `python -m usbkey_guard`. The menu offers the one-time Administrator
            step itself (UAC, then a separate window installs the system copy,
            Start menu entry and service), so there is no second command to
            remember. `python -m usbkey_guard` with no arguments is the menu.
            After an upgrade it compares the installed copy's VERSION marker with
            the running package and offers to refresh it.

            Docs in 1.0.10: README, INSTALL, QUICKSTART and LIMITATIONS all show
            that two-line install and the exact first-run prompt, QUICKSTART has
            an Upgrading section, and the command-line examples list the
            `python -m usbkey_guard ...` form for machines where `usbkey` is not
            on PATH.

            Service fix in 1.0.11: the task could sit at `Status: Ready` forever.
            `schtasks /create` gives a new task Windows' defaults "start only on
            AC power" and "stop on battery", so a laptop booting on battery never
            started the enforcer and unplugging the charger stopped it - pulling
            the stick then left plaintext readable, even after a reboot.

            The task is now registered from XML with battery restrictions off, no
            execution time limit, restart-on-failure, StartWhenAvailable, and
            boot plus logon triggers. Running state is read through the Task
            Scheduler COM API (the text check was localised), `status` decodes
            the last result and warns about old battery-blocked tasks, install
            preflights the task's Python for pywin32/psutil, startup failures go
            to `logs\enforcer-boot.log`, and a boot-started monitor now waits for
            the first enrollment instead of exiting.

            To repair an affected PC: `pip install -U usbkey-guard`, then
            `python -m usbkey_guard` and accept the refresh prompt (or run
            `python -m usbkey_guard.setup_app install` as Administrator).

            Service diagnosis in 1.0.12: when the task exists but does not run,
            `status` now names the cause instead of only the state. It prints the
            task's command and flags a missing `pythonw.exe`, the Microsoft Store
            alias (a SYSTEM task cannot execute it) or a missing
            `run_enforcer.py`, then prints the tail of
            `C:\ProgramData\usbkey\logs\enforcer-boot.log`, which holds the
            enforcer's own startup traceback because pythonw has no console. The
            TUI refresh reports the same after the elevated window instead of
            saying "Installed" and stopping. A terminated process (last result
            0x41306, which is what `schtasks /end` and Task Manager leave) is
            reported as terminated with the command to start it again, instead of
            being described as "never started". The task also gained a five-minute
            repetition trigger: RestartOnFailure only covers a process that exits
            with an error, so a service ended from Task Manager, killed by
            antivirus or by an update used to stay down until the next boot. With
            IgnoreNew the watchdog never duplicates a healthy instance.

            Dependency check in 1.0.14: the install preflight used to probe three
            module names, so a Python without `cryptography` passed and the
            enforcer died at startup. It now scans the installed package and
            imports every non-stdlib module it references (13 today, including
            cryptography, win32com.client and pywintypes), reports all missing
            ones at once, and `status` prints the exact
            `-m pip install pywin32 psutil cryptography` command for the task's
            own interpreter.

            Safety: ciphertext is flushed and verified before any plaintext is
            removed; unlock is all-or-nothing and refuses to overwrite a file
            that differs from the vault; lock keeps files edited since unlock;
            OS-owned paths, reparse points, path traversal and reserved device
            names are refused; a corrupt state file is reported, never reset.

            Stop protecting: `usbkey vault remove --vault-id <id> --yes` (or
            TUI option 8) decrypts a vault for good and deletes the encrypted
            copy only after every file is verified on disk. `--keep-ciphertext`
            keeps the encrypted folder so it can be attached again.

            Second PC: install the same package there, plug in the same stick
            and choose USE (or `usbkey enroll --drive E:\ --use-existing`) so
            the existing key.dat is kept, then attach the vault with
            `--work-dir` to pick the restore folder on that machine.

            Second-PC key fix: USE used to fail with "that key file was copied
            from a different stick" even for the right stick. Windows keeps
            volume GUIDs per machine, so the same stick reports a different GUID
            on every PC, and the old check compared those GUIDs (vault keys mixed
            the GUID in too). key.dat now binds to the stick's on-disk serial,
            version 1 files are checked with the GUID stored inside the file, and
            new vault keys use passphrase + stick secret + serial, so one stick
            opens one vault on every PC. Vaults made before 1.0.11 still unlock.
            If OVERWRITE was already chosen, the old key is in
            `C:\ProgramData\usbkey\keystore-backup` on the PC where it was
            chosen; copy it back as key.dat to recover the old vaults.

            Start menu: the all-users entry is now a real `usbkey TUI` shortcut
            (a .bat fallback is kept). The launcher is written with correct CRLF
            line endings and reports a missing Python instead of closing silently.

            Permissions: a normal (non-elevated) session could not update
            `vaults.json` because Windows grants Users only read on state files
            written by SYSTEM. `usbkey-setup install` now grants local users
            modify on the state tree (metadata only, never key material) and
            `usbkey-setup repair-permissions` fixes an existing install.

            Service: `usbkey-setup install` used to create the enforcer task
            without starting it, so a fresh install locked nothing until the
            next reboot. It now starts the task and reports whether it is
            running. `usbkey-setup status` also shows the interpreter, whether
            other users can use it, and the service state.

            Removal: TUI option 11 (or `usbkey-setup uninstall --purge`)
            removes the service, Start menu entry, Program Files copy, state
            folder and pip package in one step. It refuses while a vault is
            still registered, so encrypted data can never be stranded, and it
            never touches the stick or a vault folder.

  publish-pypi:
    needs: build
    if: vars.PYPI_PUBLISHED != github.ref_name
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
