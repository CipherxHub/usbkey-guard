name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install -e .
      - name: Test
        run: python -m pytest tests -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Build clean source zip
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'usbkey-release-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force src, tests, .github -Destination $stage
          Copy-Item -Force README.md, INSTALL.md, QUICKSTART.md, LIMITATIONS.md, RELEASE.md, LICENSE, pyproject.toml, requirements.txt, .gitignore, build_dist.ps1 -Destination $stage
          Get-ChildItem -Recurse -Force -Directory -Path $stage -Filter '__pycache__' | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse -Force -Directory -Path $stage -Filter '*.egg-info' | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse -Force -File -Path $stage -Filter '*.pyc' | Remove-Item -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath dist/usbkey-guard-source.zip
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/usbkey-guard-source.zip
          generate_release_notes: false
          body: |
            usbkey-guard ${{ github.ref_name }}

            A headless Windows tool that keeps files locked unless a specific USB
            stick is inserted. Files are encrypted with AES-GCM, so an administrator
            cannot read them without the USB key and the passphrase.

            Included: interactive TUI, scriptable CLI, all-users installer,
            SYSTEM background enforcer, recovery tools and documentation.

            Safety: ciphertext is flushed and verified before any plaintext is
            removed; unlock is all-or-nothing and refuses to overwrite a file
            that differs from the vault; lock keeps files edited since unlock;
            OS-owned paths, reparse points, path traversal and reserved device
            names are refused; a corrupt state file is reported, never reset.

            Stop protecting: `usbkey vault remove --vault-id <id> --yes` (or
            TUI option 8) decrypts a vault for good and deletes the encrypted
            copy only after every file is verified on disk. `--keep-ciphertext`
            keeps the encrypted folder so it can be attached again.

            Second PC: install the same package there, plug in the same stick
            and choose USE (or `usbkey enroll --drive E:\ --use-existing`) so
            the existing key.dat is kept, then attach the vault with
            `--work-dir` to pick the restore folder on that machine.

  publish-pypi:
    needs: build
    if: vars.PYPI_PUBLISHED != github.ref_name
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
